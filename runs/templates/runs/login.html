<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Running Club - Log In</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 400px; margin: 80px auto; padding: 0 20px; color: #333; }
        form { background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
        p { margin-bottom: 15px; }
        input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background: #218838; }
    </style>
</head>
<body>
    <h2>Log In to Running Club</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log In</button>
    </form>
    <p style="margin-top: 15px; text-align: center;">Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
</body>
</html>
